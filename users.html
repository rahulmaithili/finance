<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Control - IEMS ERP</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.4.1/css/responsive.dataTables.min.css">
    
    <!-- Firebase SDK & Config -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <!-- Navigation Loader -->
    <script src="nav-loader.js"></script>
    
    <!-- jQuery, DataTables & SweetAlert2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.4.1/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="app-wrapper">
        <!-- Main Panel Content -->
        <div class="main-content">
            <!-- Navbar -->
            <div class="navbar">
                <div class="page-title">User Controls & Settings</div>
            </div>
            
            <!-- Content Body -->
            <div class="content-body">
                <div class="module-grid">
                    <!-- Left: Users Table -->
                    <div>
                        <div class="header-title-section" style="margin-bottom: 20px;">
                            <h2>All Registered Users</h2>
                            <p>Manage system access levels, active roles, and account statuses.</p>
                        </div>
                        
                        <div class="table-card">
                            <div class="table-responsive">
                                <table id="usersTable" class="custom-table" style="width:100%;">
                                    <thead>
                                        <tr>
                                            <th>Full Name</th>
                                            <th>Email Address</th>
                                            <th>Role</th>
                                            <th>Status</th>
                                            <th>Registered At</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="usersTableBody">
                                        <!-- Loaded dynamically -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right: Add / Edit User Form -->
                    <div class="desktop-form-panel">
                        <div class="form-card">
                            <div class="form-card-title">
                                <span id="formTitle">Add User / Define Role</span>
                                <button class="btn-icon" style="border: none; display:none;" id="cancelEditBtn" onclick="resetForm()">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            
                            <form id="userForm" autocomplete="off">
                                <input type="hidden" id="editUserId">
                                
                                <div class="form-group">
                                    <label class="form-label">Full Name</label>
                                    <div class="input-icon-wrapper">
                                        <input type="text" id="full_name" class="form-control" placeholder="e.g. John Doe" required>
                                        <i class="fa-solid fa-user" style="left: 14px;"></i>
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">Email Address</label>
                                    <div class="input-icon-wrapper">
                                        <input type="email" id="email" class="form-control" placeholder="e.g. john@company.com" required>
                                        <i class="fa-solid fa-envelope" style="left: 14px;"></i>
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">User Role</label>
                                    <select id="role" class="form-control" style="padding-left:15px;" required>
                                        <option value="viewer">Viewer (Read-Only Reports Access)</option>
                                        <option value="staff">Entry Staff (Log Transactions, No Edit/Delete)</option>
                                        <option value="admin">Admin (Full Transactions Access)</option>
                                        <option value="super_admin">Super Admin (System Settings Access)</option>
                                    </select>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">Account Status</label>
                                    <select id="status" class="form-control" style="padding-left: 15px;" required>
                                        <option value="active">Active</option>
                                        <option value="inactive">Inactive</option>
                                    </select>
                                </div>
                                
                                <button type="submit" class="btn-primary" style="margin-top: 10px;">
                                    <i class="fa-solid fa-plus" id="formSubmitIcon"></i>
                                    <span id="formSubmitText">Save User Access</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        let editMode = false;
        let activeEditId = null;
        let currentAdminRole = 'staff';

        window.onNavigationLoaded = function (user, userData) {
            currentAdminRole = userData.role;
            // Only allow super_admin and admin
            if (userData.role !== 'super_admin' && userData.role !== 'admin') {
                window.location.href = 'index.html';
                return;
            }
            loadUsersTable();
        };

        function loadUsersTable() {
            const tableBody = document.getElementById('usersTableBody');
            
            db.collection('users').orderBy('full_name', 'asc').onSnapshot(snapshot => {
                if ($.fn.DataTable.isDataTable('#usersTable')) {
                    $('#usersTable').DataTable().destroy();
                }
                tableBody.innerHTML = '';
                snapshot.forEach(doc => {
                    const u = doc.data();
                    const id = doc.id;
                    const isInactive = u.status === 'inactive';
                    const isYou = (auth.currentUser && auth.currentUser.uid === id);

                    let formattedDate = '—';
                    let updatedDate = '—';
                    if (u.created_at) {
                        formattedDate = new Date(u.created_at.toMillis()).toLocaleDateString('en-IN', {
                            day: '2-digit', month: 'short', year: 'numeric'
                        });
                    }
                    if (u.updated_at) {
                        updatedDate = new Date(u.updated_at.toMillis()).toLocaleDateString('en-IN', {
                            day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                        });
                    }

                    const roleColors = { super_admin:'#ef4444', admin:'#f59e0b', staff:'#3b82f6', viewer:'#10b981' };
                    const roleColor = roleColors[u.role] || '#6366f1';
                    const roleLabel = (u.role||'').replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
                    const statusColor = isInactive ? '#ef4444' : '#10b981';

                    // View button always visible
                    const viewBtn = `<button class="btn-icon btn-view" title="View Profile"
                        onclick='viewUser(${JSON.stringify({id, full_name: u.full_name, email: u.email, role: u.role||"", status: u.status||"active", created_at: formattedDate, updated_at: updatedDate, is_you: isYou}).replace(/'/g,"&apos;")})'>
                        <i class="fa-solid fa-eye"></i></button>`;

                    let editDeleteBtns = '';
                    if (currentAdminRole === 'super_admin' || u.role !== 'super_admin') {
                        editDeleteBtns = `
                            <button class="btn-icon btn-edit" onclick="editUser('${id}')" title="Edit User"><i class="fa-solid fa-user-pen"></i></button>
                            ${!isYou ? `<button class="btn-icon btn-delete" onclick="deleteUser('${id}', '${(u.full_name||'').replace(/'/g,'')}')" title="Delete User"><i class="fa-solid fa-trash"></i></button>` : ''}
                        `;
                    } else {
                        editDeleteBtns = `<span style="font-size:0.72rem;color:var(--text-secondary);">Restricted</span>`;
                    }

                    tableBody.innerHTML += `
                    <tr>
                        <td>
                            <div style="font-weight:700;color:var(--text-light);">${u.full_name}${isYou ? ' <span style="font-size:0.68rem;color:#6366f1;background:rgba(99,102,241,0.15);padding:1px 7px;border-radius:20px;">You</span>' : ''}</div>
                        </td>
                        <td style="color:var(--text-secondary);font-size:0.88rem;">${u.email}</td>
                        <td><span style="background:${roleColor}22;color:${roleColor};border:1px solid ${roleColor}44;padding:3px 10px;border-radius:20px;font-size:0.74rem;font-weight:700;">${roleLabel}</span></td>
                        <td><span style="background:${statusColor}22;color:${statusColor};border:1px solid ${statusColor}44;padding:3px 10px;border-radius:20px;font-size:0.74rem;font-weight:700;">${(u.status||'active').charAt(0).toUpperCase()+(u.status||'active').slice(1)}</span></td>
                        <td style="font-size:0.85rem;">${formattedDate}</td>
                        <td>
                            <div style="display:flex;gap:5px;align-items:center;">
                                ${viewBtn}
                                ${editDeleteBtns}
                            </div>
                        </td>
                    </tr>`;
                });

                $('#usersTable').DataTable({
                    responsive: true,
                    order: [[4, 'desc']],
                    columnDefs: [{ orderable: false, targets: 5 }]
                });
            });
        }

        function viewUser(u) {
            const roleColors = { super_admin:'#ef4444', admin:'#f59e0b', staff:'#3b82f6', viewer:'#10b981' };
            const roleColor = roleColors[u.role] || '#6366f1';
            const roleLabel = (u.role||'').replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
            const statusColor = u.status === 'active' ? '#10b981' : '#ef4444';
            const initials = (u.full_name||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();

            Swal.fire({
                title: '',
                html: `
                    <div style="text-align:left;">
                        <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;padding:16px;background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.08));border-radius:12px;border:1px solid rgba(99,102,241,0.2);">
                            <div style="width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;color:white;flex-shrink:0;">
                                ${initials}
                            </div>
                            <div>
                                <div style="font-size:1.1rem;font-weight:800;color:var(--text-light);">${u.full_name} ${u.is_you ? '<span style="font-size:0.7rem;color:#6366f1;background:rgba(99,102,241,0.15);padding:2px 8px;border-radius:20px;margin-left:4px;">You</span>' : ''}</div>
                                <div style="font-size:0.82rem;color:var(--text-secondary);margin-top:3px;"><i class="fa-solid fa-envelope" style="margin-right:5px;color:#6366f1;"></i>${u.email}</div>
                            </div>
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
                            <div style="padding:12px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.06);">
                                <div style="font-size:0.68rem;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;"><i class="fa-solid fa-shield-halved" style="margin-right:4px;"></i>Role</div>
                                <span style="background:${roleColor}22;color:${roleColor};border:1px solid ${roleColor}44;padding:3px 10px;border-radius:20px;font-size:0.78rem;font-weight:700;">${roleLabel}</span>
                            </div>
                            <div style="padding:12px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.06);">
                                <div style="font-size:0.68rem;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;"><i class="fa-solid fa-circle-dot" style="margin-right:4px;"></i>Status</div>
                                <span style="background:${statusColor}22;color:${statusColor};border:1px solid ${statusColor}44;padding:3px 10px;border-radius:20px;font-size:0.78rem;font-weight:700;">${(u.status||'active').charAt(0).toUpperCase()+(u.status||'active').slice(1)}</span>
                            </div>
                            <div style="padding:12px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.06);">
                                <div style="font-size:0.68rem;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;"><i class="fa-solid fa-calendar-plus" style="margin-right:4px;"></i>Registered</div>
                                <div style="font-weight:600;color:var(--text-light);font-size:0.85rem;">${u.created_at}</div>
                            </div>
                            <div style="padding:12px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.06);">
                                <div style="font-size:0.68rem;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;"><i class="fa-solid fa-clock-rotate-left" style="margin-right:4px;"></i>Last Updated</div>
                                <div style="font-weight:600;color:var(--text-light);font-size:0.85rem;">${u.updated_at}</div>
                            </div>
                        </div>
                        <div style="font-size:0.72rem;color:#64748b;text-align:center;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);">
                            Firebase UID: ${u.id.substring(0,16)}... &nbsp;·&nbsp; Access governed by the <strong style="color:#6366f1;">${roleLabel}</strong> role
                        </div>
                    </div>
                `,
                showConfirmButton: true,
                confirmButtonText: '<i class="fa-solid fa-user-pen"></i> Edit User',
                confirmButtonColor: '#6366f1',
                showCancelButton: true,
                cancelButtonText: 'Close',
                background: 'var(--bg-card)',
                color: 'var(--text-light)',
                width: '480px'
            }).then(result => {
                if (result.isConfirmed) { editUser(u.id); }
            });
        }

        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const role = document.getElementById('role').value;
            const status = document.getElementById('status').value;

            if (editMode) {
                db.collection('users').doc(activeEditId).update({
                    full_name: name,
                    email: email,
                    role: role,
                    status: status
                }).then(() => {
                    Swal.fire({ icon: 'success', title: 'User Updated', timer: 1500, showConfirmButton: false });
                    logActivity(`Updated user document for ${name} (${email})`);
                    resetForm();
                });
            } else {
                // Check if email already registered in users doc
                db.collection('users').where('email', '==', email).get().then(snapshot => {
                    if (!snapshot.empty) {
                        Swal.fire({ icon: 'warning', title: 'Email Taken', text: 'Email is already registered in the system.' });
                    } else {
                        db.collection('users').add({
                            full_name: name,
                            email: email,
                            role: role,
                            status: status,
                            created_at: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(() => {
                            Swal.fire({ icon: 'success', title: 'User Pre-registered', text: 'Tell the user to sign up with this email on first login.', confirmButtonText: 'OK' });
                            logActivity(`Pre-registered user: ${name} with role ${role}`);
                            resetForm();
                        });
                    }
                });
            }
        });

        function editUser(id) {
            db.collection('users').doc(id).get().then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    editMode = true;
                    activeEditId = id;

                    document.getElementById('full_name').value = data.full_name;
                    document.getElementById('email').value = data.email;
                    document.getElementById('role').value = data.role;
                    document.getElementById('status').value = data.status;

                    document.getElementById('formTitle').textContent = 'Edit User Settings';
                    document.getElementById('formSubmitText').textContent = 'Save Changes';
                    document.getElementById('formSubmitIcon').className = 'fa-solid fa-floppy-disk';
                    document.getElementById('cancelEditBtn').style.display = 'inline-flex';
                }
            });
        }

        function deleteUser(id, userName) {
            if (id === auth.currentUser.uid) {
                Swal.fire({ icon: 'error', title: 'Self-Destruct Blocked', text: 'You cannot delete your own logged-in user profile!' });
                return;
            }

            Swal.fire({
                title: 'Delete / Deactivate User?',
                html: `<div style="font-size:0.9rem;color:var(--text-secondary);">You are about to remove <strong style="color:var(--text-light);">${userName}</strong>.<br>If they have recorded transactions, the account will be <strong style="color:#f59e0b;">deactivated</strong> instead of deleted to preserve logs.</div>`,
                icon: 'warning',
                iconColor: '#ef4444',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: '<i class="fa-solid fa-trash"></i> Yes, Delete',
                cancelButtonText: 'Cancel',
                background: 'var(--bg-card)',
                color: 'var(--text-light)'
            }).then(result => {
                if (result.isConfirmed) {
                    // Check if they have created income or expense transactions
                    const p1 = db.collection('income').where('recorded_by_uid', '==', id).limit(1).get();
                    const p2 = db.collection('expenses').where('recorded_by_uid', '==', id).limit(1).get();

                    Promise.all([p1, p2]).then(([iSnap, eSnap]) => {
                        const hasTransactions = !iSnap.empty || !eSnap.empty;

                        if (hasTransactions) {
                            // If they have dependencies, deactivate them instead of hard deleting to preserve logs
                            db.collection('users').doc(id).update({ status: 'inactive' }).then(() => {
                                Swal.fire({
                                    icon: 'info',
                                    title: 'Account Deactivated',
                                    text: 'This user has recorded transactions. Deactivated account instead of deleting to preserve audit trails.'
                                });
                                logActivity(`Deactivated user account due to dependencies: ID ${id}`);
                            });
                        } else {
                            db.collection('users').doc(id).delete().then(() => {
                                Swal.fire({ icon: 'success', title: 'User Deleted', timer: 1500, showConfirmButton: false });
                                logActivity(`Hard deleted user account: ID ${id}`);
                            });
                        }
                    });
                }
            });
        }

        function resetForm() {
            editMode = false;
            activeEditId = null;
            document.getElementById('userForm').reset();
            document.getElementById('formTitle').textContent = 'Add User / Define Role';
            document.getElementById('formSubmitText').textContent = 'Save User Access';
            document.getElementById('formSubmitIcon').className = 'fa-solid fa-plus';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }
    </script>
</body>
</html>
